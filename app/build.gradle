plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.economicgrowthapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.economicgrowthapp"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        python {
            version "3.11"
        }

        python {
            buildPython "/Applications/Python 3.11/Python Launcher.app"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}
dependencies {
    // Display shimmer effect (latest stable is still 0.5.0 – repo archived)
    implementation 'com.facebook.shimmer:shimmer:0.5.0'  // archived Jul 2019 :contentReference[oaicite:1]{index=1}

    // Retrofit networking
    implementation 'com.squareup.retrofit2:retrofit:2.12.0'             // latest stable
    implementation 'com.squareup.retrofit2:converter-gson:2.12.0'     // converter-gson latest from May 2025 :contentReference[oaicite:2]{index=2}

    implementation 'androidx.appcompat:appcompat:1.7.1'  // still current
    implementation 'com.google.android.material:material:1.9.0'  // current

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'  // current

    // Firebase
    implementation 'com.google.firebase:firebase-auth:24.0.0'          // auth updated May 2025 :contentReference[oaicite:3]{index=3}
    implementation 'com.google.android.gms:play-services-auth:21.3.0'  // unchanged

    implementation 'com.google.firebase:firebase-database:22.0.0'      // current
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0'  // current

    implementation 'com.google.firebase:firebase-inappmessaging:22.0.0' // current
    implementation 'com.google.firebase:firebase-storage:22.0.0'       // storage updated May 2025 :contentReference[oaicite:4]{index=4}

    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.2'
    implementation 'androidx.navigation:navigation-ui:2.9.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.airbnb.android:lottie:3.4.0'  // current

    // Charts & JSON
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'  // stable
    implementation 'com.google.code.gson:gson:2.13.1'          // stable

    // Image loading
    implementation 'com.squareup.picasso:picasso:2.71828'     // stable
    implementation 'com.github.bumptech.glide:glide:4.12.0'    // stable
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.android.volley:volley:1.2.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

